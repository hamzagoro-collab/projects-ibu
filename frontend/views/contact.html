<section class="page-section">
    <div class="container">
        <div class="text-center">
            <h2 class="section-heading text-uppercase">Contact</h2>
            <h3 class="section-subheading text-muted">Questions or ideas? Send us a message.</h3>
        </div>
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <form id="contactForm">
                    <div class="mb-3">
                        <label class="form-label" for="name">Name</label>
                        <input class="form-control" id="name" type="text" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" id="email" type="email" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="message">Message</label>
                        <textarea class="form-control" id="message" rows="5" required></textarea>
                    </div>
                    <div class="text-center">
                        <button class="btn btn-primary btn-xl text-uppercase" type="submit">Send Message</button>
                    </div>
                    <div class="text-center text-success mt-3 d-none" id="formMessage">
                        Thanks! (The form isn't connected to a backend yet.)
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
