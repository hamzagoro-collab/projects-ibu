<div class="view">
  <div class="auth-wrap">
    <div class="auth-card panel">
      <a class="brand auth-brand" href="#hero-main">
        <span class="brand-mark">G</span><span>Game<span class="brand-light">Vault</span></span>
      </a>
      <div class="eyebrow">WELCOME BACK</div>
      <h1>Log in to GameVault</h1>
      <p class="auth-description">Pick up where your next adventure begins.</p>
      <form id="login-form">
        <label>Email address<input type="email" required name="email" placeholder="you@example.com"></label>
        <label>Password<input type="password" required name="password" minlength="6" placeholder="At least 6 characters"></label>
        <button class="primary-button full-button" type="submit">Log in <span>→</span></button>
      </form>
      <p class="auth-switch">New to GameVault? <a class="quiet-link" href="#register-main">Create an account</a></p>
      <p class="auth-disclaimer">Demo only — this form does not create an account or send data.</p>
      <a class="quiet-link" href="#dashboard-main">← Continue to the demo</a>
    </div>
  </div>
</div>
