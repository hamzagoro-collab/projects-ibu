<div class="view">
  <div class="auth-wrap">
    <div class="auth-card panel">
      <a class="brand auth-brand" href="#hero-main">
        <span class="brand-mark">G</span><span>Game<span class="brand-light">Vault</span></span>
      </a>
      <div class="eyebrow">JOIN THE COMMUNITY</div>
      <h1>Create your account</h1>
      <p class="auth-description">Start building your personal game collection.</p>
      <form id="register-form">
        <label>Username<input required name="username" id="reg-username" placeholder="playerone" maxlength="50"></label>
        <label>Email address<input type="email" required name="email" placeholder="you@example.com"></label>
        <label>Password<input type="password" required name="password" id="reg-password" minlength="6" placeholder="At least 6 characters"></label>
        <label>Confirm password<input type="password" required name="confirm-password" id="reg-confirm" minlength="6" placeholder="Repeat your password"></label>
        <button class="primary-button full-button" type="submit">Create account <span>→</span></button>
      </form>
      <p class="auth-switch">Already have an account? <a class="quiet-link" href="#login-main">Log in</a></p>
      <p class="auth-disclaimer">Demo only — this form does not create an account or send data.</p>
      <a class="quiet-link" href="#hero-main">← Back to start</a>
    </div>
  </div>
</div>
